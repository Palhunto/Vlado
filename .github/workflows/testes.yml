name: testes

on:
  push:
    branches: [main, lancamento/integracao]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  # Em main cada commit termina a sua verificação; nas demais refs a mais nova substitui a anterior.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VLADO_EXIGIR_NODE: '1'   # sem Node o teste falha em vez de pular
  VLADO_EXIGIR_OCR: '1'    # sem Tesseract (por, eng, osd) os testes de OCR falham em vez de pular
  VLADO_EXIGIR_GIT: '1'    # git check-ignore com erro (ex.: dubious ownership) reprova em vez de pular
  PYTHONUTF8: '1'

jobs:
  rapida:
    name: Suíte rápida
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Dependências do sistema (OCR, como no Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript pngquant unpaper
      - name: Dependências Python
        run: python -m pip install -r requirements.txt
      - name: Fluxo montado confere com os módulos
        run: python scripts/montar_fluxo.py --check
      - name: Verificação do projeto
        run: python scripts/verificar_projeto.py
      - name: Suíte rápida (Python e Node; os testes Node rodam por test_*.py)
        run: python testes/executar_suite.py --rapida

  lenta:
    name: Suíte lenta
    needs: rapida
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Dependências do sistema (OCR, como no Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript pngquant unpaper
      - name: Dependências Python
        run: python -m pip install -r requirements.txt
      - name: Suíte lenta (Python)
        run: python testes/executar_suite.py --lenta
