name: testes

on:
  push:
    branches: [main, lancamento/integracao]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  # Em main cada commit termina a sua verificação; nas demais refs a mais nova substitui a anterior.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VLADO_EXIGIR_NODE: '1'   # sem Node o teste falha em vez de pular
  VLADO_EXIGIR_OCR: '1'    # sem Tesseract (por, eng, osd) os testes de OCR falham em vez de pular
  VLADO_EXIGIR_GIT: '1'    # git check-ignore com erro (ex.: dubious ownership) reprova em vez de pular
  VLADO_EXIGIR_PLAYWRIGHT: '1'   # teste de navegador sem Playwright/Chromium falha em vez de pular (testes/auxiliar_node.py, test_navegador_sem_pulo)
  PYTHONUTF8: '1'

jobs:
  rapida:
    name: Suíte rápida
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Dependências do sistema (OCR, como no Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript pngquant unpaper
      - name: Dependências Python
        run: python -m pip install -r requirements.txt
      - name: Navegador dos testes de tela (Playwright do Node e Chromium)
        # Os roteiros qa_*.cjs fazem require em .ferramentas/node/node_modules/playwright (fora do git). A versão é a
        # de testes/requirements-teste.txt, para dividir o mesmo Chromium com o portão de contraste.
        run: |
          mkdir -p .ferramentas/node
          npm install --prefix .ferramentas/node --no-save --no-package-lock playwright@1.65.2
          .ferramentas/node/node_modules/.bin/playwright install --with-deps chromium
      - name: Fluxo montado confere com os módulos
        run: python scripts/montar_fluxo.py --check
      - name: Verificação do projeto
        run: python scripts/verificar_projeto.py
      - name: Suíte rápida (Python e Node; os testes Node rodam por test_*.py)
        run: python testes/executar_suite.py --rapida

  lenta:
    name: Suíte lenta
    needs: rapida
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Dependências do sistema (OCR, como no Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-por tesseract-ocr-eng tesseract-ocr-osd \
            ghostscript pngquant unpaper
      - name: Dependências Python
        run: python -m pip install -r requirements.txt
      - name: Navegador do portão de contraste (Playwright e Chromium)
        run: |
          python -m pip install -r testes/requirements-teste.txt
          python -m playwright install --with-deps chromium
      - name: Suíte lenta (Python; inclui o portão do WCAG AA nos dois temas)
        env:
          VLADO_EXIGIR_PLAYWRIGHT: '1'   # sem Playwright o portão de contraste falha em vez de pular
          VLADO_EXIGIR_SEM_PULO: '1'     # máquina saturada em test_fila_portao e nas esperas de test_fila_extracao vira falha, não pulo (testes/apoio_cpu_baixa.py)
        run: python testes/executar_suite.py --lenta
